name: endless
description: "Endless - a handwriting-first endless notebook"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.0"

# Versions are pinned (see CLAUDE.md). Check a package is maintained and
# supports our target platforms before adding or bumping it.
dependencies:
  # Zips and unzips .board files for export and import (pure Dart).
  archive: 4.0.9
  # AES-GCM and Argon2id for locked pages (pure Dart, every platform).
  cryptography: 2.9.0
  # The library index. No drift_dev: its code generator needs a newer
  # analyzer than this Flutter SDK allows, so queries are plain SQL for now.
  drift: 2.35.0
  # Opens PDFs, images and .board files, and saves exports where the user
  # picks (Android's Save dialog; every platform).
  file_picker: 13.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  flutter_secure_storage: 11.2.0
  go_router: 17.5.0
  # Images from the tablet's photos, files or camera (first-party; Android,
  # iOS, web, Windows, Linux and macOS).
  image_picker: 1.2.3
  local_auth: 3.0.2
  path: 1.9.1
  path_parsing: 1.1.0
  path_provider: 2.1.6
  # Writes exported PDFs with vector ink and a text layer (pure Dart).
  pdf: 3.12.0
  # Renders imported PDF pages and reads their text (PDFium; every platform).
  pdfrx: 2.2.24
  # The system print dialog for a notebook's PDF (every platform).
  printing: 5.14.3
  # The share sheet for exports (every platform).
  share_plus: 13.3.1
  # 3.x builds or downloads SQLite through a build hook on every platform,
  # so no sqlite3_flutter_libs.
  sqlite3: 3.5.2
  # Opens a website card's page in the browser (first-party; every platform).
  url_launcher: 6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL-figtree.txt
    - assets/fonts/OFL-newsreader.txt
    - assets/fonts/OFL-caveat.txt

  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: Newsreader
      fonts:
        - asset: assets/fonts/Newsreader-Regular.ttf
          weight: 400
        - asset: assets/fonts/Newsreader-Medium.ttf
          weight: 500
        - asset: assets/fonts/Newsreader-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Newsreader-MediumItalic.ttf
          weight: 500
          style: italic
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Caveat-SemiBold.ttf
          weight: 600
