<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;family=Figtree:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F1E7;font-family:Figtree,'Segoe UI',system-ui,sans-serif;color:#1E1C19}
a{color:#2B5A8C;text-decoration:none}a:hover{color:#1F4570}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 1280px; height: 800px; display: flex; background: #F6F1E7; overflow: hidden; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; color: #1E1C19">

<nav aria-label="Settings" style="width: 284px; flex-shrink: 0; box-sizing: border-box; padding: 18px 14px; background: #EEE7D8; border-right: 1px solid #DDD4C2; display: flex; flex-direction: column; gap: 10px; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 6px">
<a href="Main.dc.html" aria-label="Back to library" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #1E1C19">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<span style="font-family: Newsreader, Georgia, serif; font-size: 26px">Settings</span>
</div>
<label style="display: flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 12px; background: #FFFDF8; border: 1px solid #DDD4C2; border-radius: 12px; color: #5E574C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search settings</span>
<input value="{{ q }}" onInput="{{ search }}" placeholder="Search settings" style="flex-grow: 1; min-width: 0; height: 38px; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 15px; color: #1E1C19">
</label>
<div style="display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{ navItems }}" as="n" hint-placeholder-count="12">
<sc-if value="{{ n.isLink }}" hint-placeholder-val="{{ false }}">
<a href="{{ n.href }}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 10px; font-size: 15px; color: #1E1C19">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"/></svg>
<span style="flex-grow: 1">{{ n.label }}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A8274" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
</a>
</sc-if>
<sc-if value="{{ n.isBtn }}" hint-placeholder-val="{{ true }}">
<button aria-current="{{ n.current }}" onClick="{{ n.pick }}" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border: 0; border-radius: 10px; background: {{ n.bg }}; color: #1E1C19; font-size: 15px; font-weight: {{ n.weight }}; text-align: left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ n.d }}"/></svg>
<span>{{ n.label }}</span>
</button>
</sc-if>
</sc-for>
</div>
</nav>

<main style="flex-grow: 1; box-sizing: border-box; padding: 32px 56px 48px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto">
<div style="display: flex; flex-direction: column; gap: 6px; max-width: 820px">
<h1 style="margin: 0; font-family: Newsreader, Georgia, serif; font-size: 40px; font-weight: 400; letter-spacing: -0.02em">{{ title }}</h1>
<p style="margin: 0; font-size: 15px; color: #5E574C; text-wrap: pretty">{{ intro }}</p>
</div>

<sc-if value="{{ isAccount }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 16px; max-width: 820px; box-sizing: border-box; padding: 16px 18px; background: #FFFDF8; border: 1px solid #DDD4C2; border-radius: 16px">
<span style="width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #2B5A8C; color: #FFFDF8; font-size: 22px; font-weight: 700">K</span>
<span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 18px; font-weight: 600">Kieth</span><span style="font-size: 14px; color: #5E574C">[your email] · this tablet: Galaxy Tab</span></span>
<button style="height: 42px; padding: 0 14px; border: 1px solid #CFC5B1; border-radius: 10px; background: transparent; color: #1E1C19; font-size: 14px; font-weight: 600">Edit profile</button>
</div>
</sc-if>

<sc-if value="{{ isStorage }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 12px; max-width: 820px; box-sizing: border-box; padding: 18px; background: #FFFDF8; border: 1px solid #DDD4C2; border-radius: 16px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 16px; font-weight: 600">5.0 GB used by Endless</span><span style="font-size: 13px; color: #5E574C">41 GB free on this tablet</span></div>
<div role="img" aria-label="Notes 1.2 GB, audio and video 3.4 GB, offline models 0.2 GB, cache 0.2 GB" style="display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: #EEE7D8">
<span style="width: 24%; background: #2B5A8C"></span><span style="width: 68%; background: #B5532A"></span><span style="width: 4%; background: #3E7B4F"></span><span style="width: 4%; background: #D9A21B"></span>
</div>
<div style="display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: #3D3830">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #2B5A8C"></span>Notes 1.2 GB</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #B5532A"></span>Audio &amp; video 3.4 GB</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #3E7B4F"></span>Offline models 180 MB</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #D9A21B"></span>Cache 240 MB</span>
</div>
</div>
</sc-if>

<sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 10px; max-width: 820px">
<h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5E574C">{{ g.title }}</h2>
<div style="display: flex; flex-direction: column; background: #FFFDF8; border: 1px solid #DDD4C2; border-radius: 16px">
<sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 16px; min-height: 62px; padding: 8px 18px; box-sizing: border-box; border-bottom: {{ r.divider }}">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 500; color: {{ r.labelColor }}">{{ r.label }}</span>
<sc-if value="{{ r.hasDesc }}" hint-placeholder-val="{{ true }}"><span style="font-size: 13px; color: #5E574C; text-wrap: pretty">{{ r.desc }}</span></sc-if>
</div>
<sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ true }}">
<button role="switch" aria-checked="{{ r.on }}" aria-label="{{ r.label }}" onClick="{{ r.toggle }}" style="width: 56px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent">
<span style="width: 50px; height: 30px; box-sizing: border-box; padding: 3px; display: flex; justify-content: {{ r.justify }}; border-radius: 999px; background: {{ r.track }}"><span style="width: 24px; height: 24px; border-radius: 999px; background: #FFFDF8; box-shadow: 0 1px 2px rgba(0,0,0,0.25)"></span></span>
</button>
</sc-if>
<sc-if value="{{ r.isSeg }}" hint-placeholder-val="{{ false }}">
<div role="radiogroup" aria-label="{{ r.label }}" style="display: flex; flex-shrink: 0; gap: 2px; padding: 3px; background: #EEE7D8; border-radius: 11px">
<sc-for list="{{ r.opts }}" as="o" hint-placeholder-count="3">
<button role="radio" aria-checked="{{ o.on }}" onClick="{{ o.pick }}" style="height: 38px; padding: 0 12px; border: 0; border-radius: 8px; background: {{ o.bg }}; color: #1E1C19; font-size: 13px; font-weight: {{ o.weight }}; box-shadow: {{ o.shadow }}; white-space: nowrap">{{ o.label }}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ r.isValue }}" hint-placeholder-val="{{ false }}">
<button aria-label="{{ r.label }}: {{ r.val }}" style="display: flex; flex-shrink: 0; align-items: center; gap: 8px; height: 44px; padding: 0 4px 0 12px; border: 0; border-radius: 10px; background: transparent; color: #3D3830; font-size: 14px">{{ r.val }}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8274" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
</sc-if>
<sc-if value="{{ r.isButton }}" hint-placeholder-val="{{ false }}">
<a href="{{ r.href }}" style="display: flex; flex-shrink: 0; align-items: center; height: 42px; padding: 0 16px; border-radius: 10px; background: {{ r.btnBg }}; border: 1px solid {{ r.btnBorder }}; color: {{ r.btnFg }}; font-size: 14px; font-weight: 600">{{ r.btn }}</a>
</sc-if>
</div>
</sc-for>
</div>
</section>
</sc-for>

<sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
<span style="font-size: 15px; color: #5E574C">No settings match “{{ q }}”.</span>
</sc-if>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sec: 'general', q: '', t: {}, c: {} };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var I = {
      general: 'M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0 M16 4v4M10 10v4M18 16v4',
      account: 'M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8z M4 21c1-4 4-6 8-6s7 2 8 6',
      pen: 'M4 20l1-4L16 5l3 3L8 19z M14 7l3 3',
      hand: 'M3 14l3.5-9 3.5 9M4.3 11h4.4 M13 13l3 3 6-7',
      notes: 'M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2z M5 18a2 2 0 0 1 2-2h12',
      sync: 'M7 18h10a4 4 0 0 0 .5-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z',
      themes: 'M12 3a9 9 0 1 0 0 18c1.5 0 2-1 2-2s-1-1.5-1-2.5S14 15 15 15h2a4 4 0 0 0 4-4c0-4.4-4-8-9-8z M7.5 11h.01M10 7h.01M15 7h.01',
      bell: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10 21h4',
      cal: 'M6 5h12a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z M4 10h16M9 3v4M15 3v4',
      storage: 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3',
      lock: 'M7 11h10a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2z M8 11V8a4 4 0 0 1 8 0v3',
      about: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M12 11v5M12 8h.01'
    };
    var T = function (k, label, desc, def) { return { type: 'toggle', k: k, label: label, desc: desc || '', def: def }; };
    var S = function (k, label, desc, opts, def) { return { type: 'seg', k: k, label: label, desc: desc || '', opts: opts, def: def || 0 }; };
    var V = function (label, desc, val) { return { type: 'value', label: label, desc: desc || '', val: val }; };
    var Bt = function (label, desc, btn, href, kind) { return { type: 'button', label: label, desc: desc || '', btn: btn, href: href || '#', kind: kind || 'plain' }; };
    var D = {
      general: { title: 'General', intro: 'How Endless opens, looks and feels day to day.', groups: [
        ['When I open Endless', [S('open', 'Open to', '', ['Start page', 'Last note I was in'], 0), V('Language', 'Menus and the dictionary', 'English (US)'), S('date', 'Date format', '', ['Sep 25', '25 Sep', '9/25'], 0), S('week', 'Week starts on', '', ['Sunday', 'Monday'], 0)]],
        ['Feel', [T('haptics', 'Haptic feedback', 'A light tap when a shape snaps or a tool changes', true), T('sounds', 'Sounds', '', false), T('lefty', 'Left-handed mode', 'Moves the tool menu and page bar to the right side', false)]]
      ] },
      account: { title: 'Account', intro: 'Who you are signed in as, and which services Endless can use.', groups: [
        ['Signed in with', [Bt('Google', 'Connected · Drive and Calendar (read-only)', 'Manage', '#'), Bt('Microsoft', 'Not connected · OneDrive and Outlook', 'Connect', '#', 'primary')]],
        ['This tablet', [Bt('Sign out of this tablet', 'Your notes stay on this tablet and in your cloud', 'Sign out', '#', 'danger')]]
      ] },
      pen: { title: 'Pen & S Pen', intro: 'How the pen writes and what your fingers do.', groups: [
        ['Writing', [T('pressure', 'Pressure changes thickness', '', true), T('finger', 'Fingers can draw', 'Off: only the S Pen draws; fingers pan and zoom', false), S('spenbtn', 'S Pen button', 'Hold it while writing', ['Erase', 'Select', 'Laser'], 0), T('hover', 'Hover menus', 'Hover the pen over the left menu to open it (Air view)', true)]],
        ['Gestures', [T('straighten', 'Hold to straighten lines and shapes', '', true), T('arrows', 'Flick back to make an arrow', '', true), T('scribble', 'Scribble to erase', '', true), S('scribblelvl', 'How much scribbling counts', '', ['Light', 'Normal', 'Firm'], 1)]],
        ['Menus', [T('tray', 'Show the extra colors tray', 'Up to 10 colors under the tool bar', true), T('swipetuck', 'Swipe up to tuck menus away', 'Pull down on the tool bar to bring them back', true), S('dbltap', 'Double-tap the pen tool for', '', ['Pen settings', 'Eraser'], 0)]]
      ] },
      handwriting: { title: 'Handwriting & search', intro: 'Endless reads your handwriting on this tablet, so search and spell check work offline.', groups: [
        ['Reading handwriting', [V('Languages', 'Downloaded for offline use', 'English (US)'), T('readsearch', 'Make handwriting searchable', '', true), S('convert', 'Convert to text', 'What happens to the ink', ['Replace ink', 'Keep ink too', 'Ask each time'], 2)]],
        ['Spelling & math', [T('spellLive', 'Underline spelling mistakes as I write', 'Off: only when you open Spell check', false), V('Personal dictionary', 'Words you added', '14 words'), V('Math reading', 'Built-in model · personal use only for now', 'On this tablet')]]
      ] },
      notes: { title: 'Notebooks & pages', intro: 'Defaults for new notes and what happens to deleted pages.', groups: [
        ['New notes', [S('newask', 'When I create a new note', '', ['Ask for name and location', 'Use my defaults'], 0), V('Default folder', '', 'School'), S('saveto', 'Save new notes to', '', ['This tablet', 'Google Drive', 'OneDrive'], 1), S('paper', 'Default paper', '', ['Dots', 'Lines', 'Grid', 'Blank'], 0)]],
        ['Pages', [T('pagenums', 'Show page numbers', '', true), S('trash', 'Keep deleted pages in Trash', '', ['7 days', '30 days', 'Until I empty it'], 1), V('Version history', 'Earlier versions of each page', 'Keep 30 days')]]
      ] },
      notify: { title: 'Notifications & reminders', intro: 'Choose what Endless may remind you about.', groups: [
        ['Reminders', [T('remind', 'Need to remember reminders', '', true), V('Flashcards due', 'A daily nudge when cards are due', 'Daily · 6:00 PM'), S('calalert', 'Calendar events', '', ['Off', '10 min before', '30 min before'], 1)]],
        ['Quiet', [T('quiet', 'Quiet hours', 'No reminders 10 PM – 7 AM', true)]]
      ] },
      calendar: { title: 'Calendar', intro: 'Endless shows your Google and Outlook events. Two-way sync, where changes in Endless go back to your calendar, is coming later.', groups: [
        ['Connected calendars', [T('calSchool', 'School', 'Google · read-only', true), T('calPersonal', 'Personal', 'Google · read-only', true), T('calWork', 'Work', 'Outlook · read-only', true), Bt('Add a calendar', '', 'Add', '#')]],
        ['Show', [T('declined', 'Declined events', '', false), T('deadlines', 'Note deadlines', 'Dates from Need to remember and planner to-dos', true)]]
      ] },
      storage: { title: 'Storage', intro: 'What Endless keeps on this tablet.', groups: [
        ['Offline downloads', [V('Handwriting model', 'English (US)', '22 MB'), V('Math model', '', '62 MB'), V('Dictionary & thesaurus', '', '41 MB')]],
        ['Videos & cache', [S('videos', 'Large videos', '', ['Keep on this tablet', 'Move to my cloud'], 0), Bt('Clear cache', 'Thumbnails and previews are rebuilt when needed · 240 MB', 'Clear', '#')]]
      ] },
      privacy: { title: 'Privacy & security', intro: 'Your notes stay on this tablet and in your own cloud. Endless has no server of its own that stores them.', groups: [
        ['Locks', [T('applock', 'Lock the app', 'Ask for fingerprint or face when Endless opens', false), S('lockafter', 'Lock again after', '', ['Right away', '1 min', '5 min'], 1), V('Locked pages', 'Encrypted on this tablet', '4 pages · 1 notebook')]],
        ['Your data', [T('usage', 'Share anonymous usage data', 'Off: Endless sends nothing about you or your notes', false), Bt('Export all my notes', 'Every notebook as board files', 'Export', 'Export.dc.html'), Bt('Delete all data on this tablet', 'Your cloud copies are not touched', 'Delete…', '#', 'danger')]]
      ] },
      about: { title: 'About', intro: 'Endless · a notebook that never runs out of paper.', groups: [
        ['App', [V('Version', '', '0.9 · build 42'), V('What’s new', '', ''), V('Help & tips', '', ''), V('Open-source licenses', '', ''), Bt('Send feedback', '', 'Write to us', '#')]]
      ] }
    };
    var NAV = [['general', 'General', I.general], ['account', 'Account', I.account], ['pen', 'Pen & S Pen', I.pen], ['handwriting', 'Handwriting & search', I.hand], ['notes', 'Notebooks & pages', I.notes], ['sync', 'Sync & backup', I.sync, 'Sync.dc.html'], ['themes', 'Themes & dark mode', I.themes, 'Themes.dc.html'], ['notify', 'Notifications', I.bell], ['calendar', 'Calendar', I.cal], ['storage', 'Storage', I.storage], ['privacy', 'Privacy & security', I.lock], ['about', 'About', I.about]];
    var q = (st.q || '').toLowerCase().trim();
    var navItems = NAV.map(function (n) {
      var on = !q && st.sec === n[0];
      return { label: n[1], d: n[2], isLink: !!n[3], isBtn: !n[3], href: n[3] || '#', current: on ? 'page' : 'false', bg: on ? '#E0D6C2' : 'transparent', weight: on ? 600 : 400, pick: function () { self.setState({ sec: n[0], q: '' }); } };
    });
    var mkRow = function (r, last) {
      var base = { label: r.label, desc: r.desc, hasDesc: !!r.desc, divider: last ? '0' : '1px solid #EAE3D5', isToggle: r.type === 'toggle', isSeg: r.type === 'seg', isValue: r.type === 'value', isButton: r.type === 'button', labelColor: r.kind === 'danger' ? '#A3302A' : '#1E1C19' };
      if (r.type === 'toggle') { var on = st.t[r.k] === undefined ? r.def : st.t[r.k]; base.on = on ? 'true' : 'false'; base.justify = on ? 'flex-end' : 'flex-start'; base.track = on ? '#2B5A8C' : '#B8AE9B'; base.toggle = function () { var t = Object.assign({}, st.t); t[r.k] = !on; self.setState({ t: t }); }; }

      if (r.type === 'value') base.val = r.val;
      if (r.type === 'button') { base.btn = r.btn; base.href = r.href; base.btnBg = r.kind === 'primary' ? '#2B5A8C' : 'transparent'; base.btnFg = r.kind === 'primary' ? '#FFFDF8' : (r.kind === 'danger' ? '#A3302A' : '#1E1C19'); base.btnBorder = r.kind === 'primary' ? '#2B5A8C' : (r.kind === 'danger' ? '#E2B4AE' : '#CFC5B1'); }
      return base;

    var groups = [], title, intro, sec = st.sec;
    if (q) {
      Object.keys(D).forEach(function (k) {
        D[k].groups.forEach(function (g) {
          var rows = g[1].filter(function (r) { return (r.label + ' ' + r.desc).toLowerCase().indexOf(q) >= 0; });
          if (rows.length) groups.push({ title: D[k].title + ' › ' + g[0], rows: rows.map(function (r, i) { return mkRow(r, i === rows.length - 1); }) });
        });
      });
      title = 'Search'; intro = groups.length ? 'Settings that match “' + st.q + '”' : '';
    } else {
      var d = D[sec];
      title = d.title; intro = d.intro;
      groups = d.groups.map(function (g) { return { title: g[0], rows: g[1].map(function (r, i) { return mkRow(r, i === g[1].length - 1); }) }; });
    }
    return {
      navItems: navItems, groups: groups, title: title, intro: intro, q: st.q,
      search: function (e) { self.setState({ q: e.target.value }); },
      isAccount: !q && sec === 'account', isStorage: !q && sec === 'storage', noResults: !!q && groups.length === 0
    };
  }
}
</script>
</body>
</html>
