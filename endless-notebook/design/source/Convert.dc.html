<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Handwriting to text</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&amp;family=Figtree:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F1E7;font-family:Figtree,'Segoe UI',system-ui,sans-serif;color:#1E1C19}
a{color:#2B5A8C;text-decoration:none}a:hover{color:#1F4570}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background-color: #F6F1E7; background-image: radial-gradient(#D6CDBA 1.3px, transparent 1.4px); background-size: 26px 26px; background-position: 13px 13px; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; color: #1E1C19">

<div style="position: absolute; left: 300px; top: 96px; font-family: Caveat, 'Segoe Print', cursive; font-size: 50px; font-weight: 600; color: #2B5A8C; line-height: 1">Lecture 3 — Momentum</div>
<svg width="340" height="200" viewBox="0 0 340 200" fill="none" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 900px; top: 250px" aria-label="Diagram: block on an incline">
<path d="M10 176 L300 176 L300 36 Z" stroke="#1E1C19" stroke-width="2.5"/>
<rect x="145" y="62" width="52" height="34" stroke="#1E1C19" stroke-width="2.5" transform="rotate(-25.8 170 96)"/>
<path d="M168 82 L168 156 M161 146 L168 157 L175 146" stroke="#B5532A" stroke-width="2.5"/>
</svg>

<sc-if value="{{ showInk }}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 306px; top: 256px; font-family: Caveat, 'Segoe Print', cursive; font-size: 42px; color: #1E1C19; line-height: 1.2">total momentum is conserved<br>in a closed system</div>
<svg width="560" height="150" viewBox="0 0 560 150" fill="none" style="position: absolute; left: 276px; top: 234px" aria-label="Lasso selection around two lines of handwriting">
<path d="M22 30 C 120 4, 420 2, 530 20 C 556 40, 552 118, 520 132 C 400 148, 120 148, 34 128 C 6 112, 4 48, 22 30 Z" stroke="#2B5A8C" stroke-width="2" stroke-dasharray="7 6" fill="rgba(43,90,140,0.06)"/>
</svg>
</sc-if>

<sc-if value="{{ isPanel }}" hint-placeholder-val="{{ true }}">
<div role="menu" aria-label="Selection actions" style="position: absolute; left: 300px; top: 176px; display: flex; gap: 2px; padding: 3px; background: #1E1C19; border-radius: 12px; box-shadow: 0 8px 20px -10px rgba(30,28,25,0.6)">
<button role="menuitem" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: #2B5A8C; color: #FFFDF8; font-size: 14px; font-weight: 600">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V4h16v3M12 4v16M9 20h6"/></svg>
Convert to text</button>
<button role="menuitem" style="height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #FFFDF8; font-size: 14px; font-weight: 500">Copy</button>
<button role="menuitem" style="height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #FFFDF8; font-size: 14px; font-weight: 500">Color</button>
<button role="menuitem" style="height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #FFFDF8; font-size: 14px; font-weight: 500">Straighten lines</button>
<button role="menuitem" style="height: 40px; padding: 0 12px; border: 0; border-radius: 9px; background: transparent; color: #FFFDF8; font-size: 14px; font-weight: 500">Delete</button>
</div>

<section aria-label="Handwriting to text" style="position: absolute; left: 286px; top: 396px; width: 580px; box-sizing: border-box; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; background: #FFFDF8; border: 1px solid #DDD4C2; border-radius: 18px; box-shadow: 0 24px 48px -20px rgba(30,28,25,0.45)">
<div style="display: flex; align-items: center; gap: 10px">
<h2 style="margin: 0; flex-grow: 1; font-size: 16px; font-weight: 600">Convert to text</h2>
<button style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 1px solid #CFC5B1; border-radius: 10px; background: transparent; color: #1E1C19; font-size: 13px; font-weight: 500">English
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
</button>
<button aria-label="Close" onClick="{{ cancel }}" style="width: 44px; height: 44px; margin: -8px -10px -8px 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #5E574C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Recognized text, editable</span>
<span style="display: block; min-height: 56px; padding: 12px 14px; border: 1.5px solid #2B5A8C; border-radius: 12px; background: #FFFDF8; font-family: Newsreader, Georgia, serif; font-size: 22px; line-height: 1.35">Total momentum is <span style="text-decoration: underline dotted #B5532A 2px; text-underline-offset: 4px">{{ word }}</span> in a closed system.</span>
</label>
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<span style="font-size: 13px; color: #5E574C">Not sure about one word:</span>
<sc-for list="{{ alts }}" as="a" hint-placeholder-count="3">
<button aria-pressed="{{ a.on }}" onClick="{{ a.pick }}" style="height: 36px; padding: 0 12px; border: 1px solid {{ a.border }}; border-radius: 999px; background: {{ a.bg }}; color: {{ a.fg }}; font-size: 14px; font-weight: 500">{{ a.label }}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5E574C">Then</span>
<div role="radiogroup" aria-label="What happens to the ink" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; background: #EEE7D8; border-radius: 12px">
<sc-for list="{{ places }}" as="p" hint-placeholder-count="3">
<button role="radio" aria-checked="{{ p.on }}" onClick="{{ p.pick }}" style="height: 42px; border: 0; border-radius: 9px; background: {{ p.bg }}; color: #1E1C19; font-size: 14px; font-weight: {{ p.weight }}; box-shadow: {{ p.shadow }}">{{ p.label }}</button>
</sc-for>
</div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<button style="height: 44px; padding: 0 6px; border: 0; background: transparent; color: #2B5A8C; font-size: 14px; font-weight: 600">Convert the whole page</button>
<div style="display: flex; gap: 8px">
<button onClick="{{ cancel }}" style="height: 46px; padding: 0 18px; border: 1px solid #CFC5B1; border-radius: 12px; background: transparent; color: #1E1C19; font-size: 15px; font-weight: 500">Cancel</button>
<button onClick="{{ convert }}" style="height: 46px; padding: 0 20px; border: 0; border-radius: 12px; background: #1E1C19; color: #FFFDF8; font-size: 15px; font-weight: 600">{{ cta }}</button>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{ isDone }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 300px; top: 262px; width: 560px; padding: 8px 10px; border: 1.5px solid rgba(43,90,140,0.5); border-radius: 8px; font-family: Newsreader, Georgia, serif; font-size: 30px; line-height: 1.3; color: #1E1C19">Total momentum is {{ word }} in a closed system.</div>
<sc-if value="{{ keptInk }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 306px; top: 360px; font-family: Caveat, 'Segoe Print', cursive; font-size: 42px; color: #5E574C; line-height: 1.2">total momentum is conserved<br>in a closed system</div>
</sc-if>
<div role="status" style="position: absolute; left: 0; right: 0; bottom: 24px; display: flex; justify-content: center">
<span style="display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 16px; border-radius: 999px; background: #1E1C19; color: #FFFDF8; font-size: 14px">{{ doneMsg }}<button onClick="{{ undo }}" style="height: 38px; padding: 0 14px; border: 0; border-radius: 999px; background: #3D3830; color: #FFFDF8; font-size: 13px; font-weight: 600">Undo</button></span>
</div>
</sc-if>

<header style="position: absolute; left: 0; top: 0; width: 1280px; height: 72px; box-sizing: border-box; padding: 0 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 12px">
<div style="justify-self: start; display: flex; align-items: center; gap: 4px; padding: 4px 16px 4px 4px; background: #FFFDF8; border: 1px solid #DDD4C2; border-radius: 16px; box-shadow: 0 6px 18px -12px rgba(30,28,25,0.45)">
<a href="Canvas.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; color: #1E1C19">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
</a>
<div style="display: flex; flex-direction: column; gap: 1px">
<span style="font-size: 16px; font-weight: 600; white-space: nowrap">Physics — Lecture notes</span>
<span style="font-size: 13px; color: #5E574C; white-space: nowrap">Page 3 of 12 · Saved</span>
</div>
</div>
<div role="toolbar" aria-label="Writing tools" style="display: flex; align-items: center; gap: 2px; padding: 4px; background: #FFFDF8; border: 1px solid #DDD4C2; border-radius: 16px; box-shadow: 0 6px 18px -12px rgba(30,28,25,0.45)">
<button aria-label="Undo" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
<button aria-label="Redo" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
<div style="width: 1px; height: 28px; background: #DDD4C2; margin: 0 4px"></div>
<button aria-label="Select" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l12 8-5.5 1.2L10 18z"/></svg></button>
<button aria-label="Lasso select" aria-pressed="true" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: #1E1C19; color: #FFFDF8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4c5 0 8 2.4 8 5.4S16.5 15 12 15s-8-2.6-8-5.6S7 4 12 4z" stroke-dasharray="3 2.6"/><path d="M7.5 13.5c-1 2.2.2 4.5 2.5 5.5"/></svg></button>
<div style="width: 1px; height: 28px; background: #DDD4C2; margin: 0 4px"></div>
<button aria-label="Pen" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
<button aria-label="Marker" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 15l-4 4h5l2-2"/><path d="M9 15l8-10 3 3-10 8z"/><path d="M13 21h8"/></svg></button>
<button aria-label="Eraser" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16l9-9 6 6-6 6H7z"/><path d="M13 19h8"/></svg></button>
<button aria-label="Shapes" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="9" height="9" rx="1"/><circle cx="16" cy="8" r="5"/></svg></button>
<button aria-label="Text" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7V4h14v3M12 4v16M9 20h6"/></svg></button>
<div style="width: 1px; height: 28px; background: #DDD4C2; margin: 0 4px"></div>
<button aria-label="Quick color: Ink black" style="width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent"><span style="width: 22px; height: 22px; border-radius: 999px; background: #1E1C19"></span></button>
<button aria-label="Quick color: Deep blue" style="width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent"><span style="width: 22px; height: 22px; border-radius: 999px; background: #2B5A8C; box-shadow: 0 0 0 3px #FFFDF8, 0 0 0 5px #2B5A8C"></span></button>
<button aria-label="Quick color: Terracotta" style="width: 36px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent"><span style="width: 22px; height: 22px; border-radius: 999px; background: #B5532A"></span></button>
<button aria-label="Color and thickness" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: #EEE7D8"><span style="width: 6px; height: 6px; border-radius: 999px; background: #2B5A8C"></span></button>
</div>
<div style="justify-self: end; display: flex; align-items: center; gap: 4px; padding: 4px; background: #FFFDF8; border: 1px solid #DDD4C2; border-radius: 16px; box-shadow: 0 6px 18px -12px rgba(30,28,25,0.45)">
<a href="Share.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 14px; border-radius: 12px; background: #1E1C19; color: #FFFDF8; font-size: 15px; font-weight: 600">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5M18 8v6M15 11h6"/></svg>
Share
</a>
<button aria-label="More options" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 12px; background: transparent; color: #1E1C19"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></button>
</div>
</header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'panel', word: 'conserved', place: 'replace' };
  }
  renderVals() {
    var self = this;
    var st = this.state;
    var alts = ['conserved', 'conversed', 'concerned'].map(function (w) {
      var on = st.word === w;
      return { label: w, on: on ? 'true' : 'false', bg: on ? '#1E1C19' : 'transparent', fg: on ? '#FFFDF8' : '#1E1C19', border: on ? '#1E1C19' : '#CFC5B1', pick: function () { self.setState({ word: w }); } };
    });
    var places = [{ id: 'replace', label: 'Replace the ink' }, { id: 'keep', label: 'Keep ink too' }, { id: 'copy', label: 'Copy text only' }].map(function (p) {
      var on = st.place === p.id;
      return { label: p.label, on: on ? 'true' : 'false', bg: on ? '#FFFDF8' : 'transparent', weight: on ? 600 : 500, shadow: on ? '0 1px 2px rgba(30,28,25,0.15)' : 'none', pick: function () { self.setState({ place: p.id }); } };
    });
    var done = st.step === 'done';
    var copyOnly = st.place === 'copy';
    return {
      alts: alts, places: places, word: st.word,
      isPanel: !done,
      isDone: done && !copyOnly,
      showInk: !done || copyOnly,
      keptInk: st.place === 'keep',
      cta: copyOnly ? 'Copy text' : 'Convert',
      doneMsg: st.place === 'keep' ? 'Text added above your ink' : 'Handwriting converted to text',
      convert: function () { self.setState({ step: copyOnly ? 'panel' : 'done' }); },
      cancel: function () { self.setState({ step: 'panel' }); },
      undo: function () { self.setState({ step: 'panel' }); }
    };
  }
}
</script>
</body>
</html>
